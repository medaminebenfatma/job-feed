name: Fetch jobs

on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours
  workflow_dispatch:
    inputs:
      force_apify:
        description: "Run the paid Apify searches now"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: fetch-jobs
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch offers
        env:
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          FORCE_APIFY: ${{ inputs.force_apify }}
        run: python fetch_jobs.py
      - name: Commit jobs.json if changed
        run: |
          git config user.name "job-feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update jobs.json"
          git push
